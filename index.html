<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>თამუსთვის ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #222;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 28px;
      animation: float 7s linear infinite;
      opacity: 0.7;
    }

    .h1 { left: 8%;  animation-delay: 0s; }
    .h2 { left: 25%; animation-delay: 2s; }
    .h3 { left: 48%; animation-delay: 4s; }
    .h4 { left: 72%; animation-delay: 1s; }
    .h5 { left: 88%; animation-delay: 3s; }

    @keyframes float {
      0% {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-20vh) rotate(25deg);
        opacity: 0;
      }
    }

    .container {
      width: 92%;
      max-width: 520px;
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 35px 20px;
    }

    .emoji {
      font-size: 70px;
      margin-bottom: 10px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    h1 {
      font-size: 38px;
      margin: 10px 0;
    }

    .subtitle {
      font-size: 19px;
      color: #777;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .card {
      background: #fff;
      border-radius: 25px;
      padding: 30px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }

    .message {
      font-size: 20px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 15px 30px;
      font-size: 18px;
      background: #ff5c8a;
      color: white;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(255,92,138,0.3);
    }

    button:active {
      transform: scale(0.96);
    }

    #secret {
      display: none;
      margin-top: 25px;
      font-size: 22px;
      line-height: 1.7;
      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .small {
      margin-top: 25px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="bg">
    <div class="heart h1">❤️</div>
    <div class="heart h2">💕</div>
    <div class="heart h3">💗</div>
    <div class="heart h4">❤️</div>
    <div class="heart h5">💖</div>
  </div>

  <div class="container">

    <div class="emoji">❤️</div>

    <h1>თამუსთვის</h1>

    <div class="subtitle">
      ერთი პატარა სიურპრიზი შენთვის...
    </div>

    <div class="card">

      <div class="message">
        შენ შეიძლება არ იცოდე,
        მაგრამ ძალიან განსაკუთრებული ადამიანი ხარ. ❤️
        <br><br>
        ეს პატარა გვერდი მხოლოდ შენთვის გავაკეთე.
      </div>

      <button onclick="showSecret()">
        დააჭირე აქ 💌
      </button>

      <div id="secret">
        მიყვარხარ ❤️
        <br>
        და მინდა ყოველთვის იღიმოდე. 🥰
      </div>

    </div>

    <div class="small">
      made with ❤️
    </div>

  </div>

  <script>
    function showSecret() {
      document.getElementById("secret").style.display = "block";
    }
  </script>

</body>
</html>
